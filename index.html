  function getNormalizedSneakerCm() {
    const rawVal = parseFloat(document.getElementById('input-sneaker').value) || 26.0;
    const unit = document.getElementById('input-sneaker-unit').value;

    if (unit === 'cm') {
      return rawVal;
    } else if (unit === 'EU') {
      return 26.0 + (rawVal - 39.5) * 0.666667;
    } else if (unit === 'US') {
      return 26.0 + (rawVal - 8.0) * 1.0;
    }
    return rawVal;
  }

  function parseNum(val, defaultVal = 0) {
    if (val === null || val === undefined || val === '') return defaultVal;
    const normalized = String(val).replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
    const parsed = parseFloat(normalized);
    return isNaN(parsed) ? defaultVal : parsed;
  }

  function formatPrice(priceVal) {
    if (!priceVal && priceVal !== 0) return "";
    let rawStr = String(priceVal).replace(/[￥¥,]/g, '').trim();
    let num = parseInt(rawStr, 10);
    if (!isNaN(num)) {
      return "￥" + num.toLocaleString();
    }
    return "￥" + String(priceVal).replace(/^[¥￥]/, '');
  }

  function getJSTNowString() {
    const now = new Date();
    const jstTime = new Date(now.getTime() + (9 * 60 * 60 * 1000));
    const yyyy = jstTime.getUTCFullYear();
    const mm = String(jstTime.getUTCMonth() + 1).padStart(2, '0');
    const dd = String(jstTime.getUTCDate()).padStart(2, '0');
    const hh = String(jstTime.getUTCHours()).padStart(2, '0');
    const min = String(jstTime.getUTCMinutes()).padStart(2, '0');
    const ss = String(jstTime.getUTCSeconds()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}T${hh}:${min}:${ss}`;
  }

  function generateDiagnosisId() {

  function parseGasResponse(rawData) {
    if (!Array.isArray(rawData) || rawData.length === 0) return [];
    const firstItem = rawData[0];
    if (firstItem.hasOwnProperty('brand') || firstItem.hasOwnProperty('name')) return rawData;

    let shoeMap = {};
    rawData.forEach(row => {
      let propKey = "";
      for (let k in row) {
        if (k.includes("列名") || k.includes("キー") || k === "key" || k === "column1") {
          propKey = String(row[k]).trim();
          break;
        }
      }
      if (!propKey && Object.keys(row).length > 0) propKey = String(Object.values(row)[0]).trim();
      if (!propKey || propKey.includes("---")) return;

      for (let key in row) {
        if (key.includes("列名") || key.includes("キー") || key.includes("説明") || key === "key" || key === "column1") continue;
        if (!shoeMap[key]) shoeMap[key] = {};
        shoeMap[key][propKey] = row[key];
      }
    });

    return Object.values(shoeMap).filter(s => s.name || s.brand);
  }

  async function loadDatabase() {
    const loadingText = document.getElementById('loading-status-text');
    loadingText.innerHTML = I18N[currentLang].loading;

    try {
      const response = await fetch(GAS_DATABASE_URL, { method: "GET", redirect: "follow" });
      if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

      const rawData = await response.json();
      const parsedData = parseGasResponse(rawData);

      if (!Array.isArray(parsedData) || parsedData.length === 0) {
        throw new Error("Could not parse database structure.");
      }

      SHOE_DATABASE = parsedData.map(item => {
        let cleaned = {};
        for (let key in item) {
          if (!key.includes("---")) cleaned[key] = item[key];
        }

        return {
          ...cleaned,
          id: parseNum(cleaned.id, 0),
          categoryLevel: parseNum(cleaned.categoryLevel, 1),
          sizeMin: parseNum(cleaned.sizeMin, 0),
          sizeMax: parseNum(cleaned.sizeMax, 999),
          sizeOffset: parseNum(cleaned.sizeOffset, 0),
          price: formatPrice(cleaned.price),
          sizeUnit: cleaned.sizeUnit || "US",
          score_level: parseNum(cleaned.score_level, 5),
          score_width_narrow: parseNum(cleaned.score_width_narrow, 3),
          score_width_normal: parseNum(cleaned.score_width_normal, 3),
          score_width_wide: parseNum(cleaned.score_width_wide, 3),
          score_instep_low: parseNum(cleaned.score_instep_low, 3),
          score_instep_normal: parseNum(cleaned.score_instep_normal, 3),
          score_instep_high: parseNum(cleaned.score_instep_high, 3),
          score_toe_egyptian: parseNum(cleaned.score_toe_egyptian, 3),
          score_toe_roman: parseNum(cleaned.score_toe_roman, 3),
          score_toe_greek: parseNum(cleaned.score_toe_greek, 3),
          score_heel_narrow: parseNum(cleaned.score_heel_narrow, 3),
          score_heel_normal: parseNum(cleaned.score_heel_normal, 3),
          score_heel_large: parseNum(cleaned.score_heel_large, 3),
          score_perf_soft: parseNum(cleaned.score_perf_soft, 3),
          score_perf_allround: parseNum(cleaned.score_perf_allround, 3),
          score_perf_hard: parseNum(cleaned.score_perf_hard, 3)
        };
      });

      document.getElementById('view-loading').classList.add('hidden');
      document.getElementById('view-form').classList.remove('hidden');

    } catch (err) {
      console.error("Database fetch error:", err);
      loadingText.innerHTML = `
        <div style="color: #f87171; margin-bottom: 12px; font-weight: bold;">Loading Failed / 読み込み失敗</div>
        <div style="font-size:0.8rem; color:#94a3b8; margin-bottom: 16px;">Detail: ${err.message}</div>
        <button type="button" onclick="loadDatabase()" class="btn-submit" style="padding:8px 16px; font-size:0.9rem;">Retry / 再試行</button>
      `;
    }
  }

  function roundToHalf(val) {
    return (Math.round(val * 2) / 2).toFixed(1);
  }

  function getScaleOffsets(d) {
    return { us: d / 1.0, eu: d / 0.666667, uk: d / 0.85 };
  }

  function calculateStandardSizes(sneakerSize) {
    const d = sneakerSize - 26.0;
    const off = getScaleOffsets(d);
    if (currentLang === 'en') {
      return `La Sportiva / Scarpa: EU ${roundToHalf(40.0 + off.eu)} - ${roundToHalf(41.0 + off.eu)} | Unparallel / Butora / MadRock: US ${roundToHalf(8.0 + off.us)} - ${roundToHalf(9.0 + off.us)} | Boreal / Tenaya: UK ${roundToHalf(7.0 + off.uk)} - ${roundToHalf(8.0 + off.uk)}`;
    }
    return `スポルティバ/スカルパ: EU ${roundToHalf(40.0 + off.eu)}〜${roundToHalf(41.0 + off.eu)} | アンパラレル/ブトラ/マッドロック: US ${roundToHalf(8.0 + off.us)}〜${roundToHalf(9.0 + off.us)} | ボリエール/テナヤ: UK ${roundToHalf(7.0 + off.uk)}〜${roundToHalf(8.0 + off.uk)}`;
  }

  function getBaseCalculatedSize(shoe, sneakerSize) {
    const d = sneakerSize - 26.0;
    const off = getScaleOffsets(d);
    const offset = shoe.sizeOffset || 0.0;
    
    if (shoe.sizeUnit === 'EU') {
      return 39.5 + off.eu + offset;
    } else if (shoe.sizeUnit === 'US') {
      return 8.0 + off.us + offset;
    } else {
      return 7.0 + off.uk + offset;
    }
  }

  function getRecommendedSizeText(shoe, sneakerSize) {
    const base = getBaseCalculatedSize(shoe, sneakerSize);
    const sep = (currentLang === 'en') ? " - " : " 〜 ";
    return `${shoe.sizeUnit} ${roundToHalf(base - 0.5)}${sep}${roundToHalf(base + 0.5)}`;
  }

  function runDiagnosis() {
    try {
      currentDiagnosisId = generateDiagnosisId();
      isRatingSubmitted = false;

      const t = I18N[currentLang];
      const btnRating = document.getElementById('btn-submit-rating');
      if (btnRating) {
        btnRating.disabled = false;
        btnRating.innerText = t.btnSubmitRating;
      }

      const sneakerSize = getNormalizedSneakerCm();
      const rawInputVal = document.getElementById('input-sneaker').value;
      const rawUnitVal = document.getElementById('input-sneaker-unit').value;
      const levelSelect = document.getElementById('input-level');
      const userLevel = parseInt(levelSelect.value, 10);
      
      const userAnswers = {
        sneaker: `${rawInputVal}${rawUnitVal} (calc: ${sneakerSize.toFixed(1)}cm)`,
        levelVal: userLevel,
        levelText: levelSelect.options[levelSelect.selectedIndex].text,
        widthText: getSelectedText('group-width'),
        instepText: getSelectedText('group-instep'),
        heelText: getSelectedText('group-heel'),
        toeText: getSelectedText('group-toe'),
        perfText: getSelectedText('group-perf'),
        priorityText: getSelectedText('group-priority'),
        width: getSelectedValue('group-width'),
        instep: getSelectedValue('group-instep'),
        heel: getSelectedValue('group-heel'),
        toe: getSelectedValue('group-toe'),
        perf: getSelectedValue('group-perf'),
        priority: getSelectedValue('group-priority')
      };

      document.getElementById('standard-size-display').innerText = calculateStandardSizes(sneakerSize);

      const processedShoes = SHOE_DATABASE.map(shoe => {
        const isLevelMatched = (userLevel === shoe.categoryLevel);
        const recommendedSizeText = getRecommendedSizeText(shoe, sneakerSize);
        const baseCalculatedSize = getBaseCalculatedSize(shoe, sneakerSize);
        const inStock = (baseCalculatedSize >= shoe.sizeMin && baseCalculatedSize <= shoe.sizeMax);

        let score = 0;
        if (isLevelMatched) {
          score += (shoe.score_level * 15) * 3;
        } else {
          score -= 150;
        }

        const scoreWidth = (userAnswers.width === 'none') ? 3 : (shoe[`score_width_${userAnswers.width}`] || 3);
        const scoreInstep = (userAnswers.instep === 'none') ? 3 : (shoe[`score_instep_${userAnswers.instep}`] || 3);
        const scoreHeel = (userAnswers.heel === 'none') ? 3 : (shoe[`score_heel_${userAnswers.heel}`] || 3);
        const scoreToe = (userAnswers.toe === 'none') ? 3 : (shoe[`score_toe_${userAnswers.toe}`] || 3);
        const scorePerf = (userAnswers.perf === 'none') ? 3 : (shoe[`score_perf_${userAnswers.perf}`] || 3);

        score += scoreWidth + scoreInstep + scoreHeel + scoreToe + scorePerf;

        if (userAnswers.priority === 'width' && userAnswers.width !== 'none') {
          score += (scoreWidth >= 4) ? 10 : 0;
        } else if (userAnswers.priority === 'instep' && userAnswers.instep !== 'none') {
          score += (scoreInstep >= 4) ? 10 : 0;
        } else if (userAnswers.priority === 'heel' && userAnswers.heel !== 'none') {
          score += (scoreHeel >= 4) ? 10 : 0;
        } else if (userAnswers.priority === 'toe' && userAnswers.toe !== 'none') {
          score += (scoreToe >= 4) ? 10 : 0;
        } else if (userAnswers.priority === 'perf' && userAnswers.perf !== 'none') {
          score += (scorePerf >= 4) ? 10 : 0;
        }

        return {
          ...shoe,
          isLevelMatched,
          recommendedSize: recommendedSizeText,
          inStock,
          calculatedScore: score
        };
      });

      const scoredShoes = processedShoes.sort((a, b) => {
        if (a.inStock !== b.inStock) {
          return a.inStock ? -1 : 1;
        }
        return b.calculatedScore - a.calculatedScore;
      }).slice(0, 5);

      const container = document.getElementById('recommendations-container');
      container.innerHTML = '';

      scoredShoes.forEach((shoe, idx) => {
        const card = document.createElement('div');
        card.className = 'shoe-card';

        const displayName = (currentLang === 'en' && shoe.name_en) ? shoe.name_en : shoe.name;
        const displayDesc = (currentLang === 'en' && shoe.description_en) ? shoe.description_en : (shoe.description || "");
        const taxLabel = (currentLang === 'en') ? t.priceTax : "（税込）";

        card.innerHTML = `
          <div class="shoe-img-wrapper">
            <img class="shoe-img" src="${shoe.imageUrl}" alt="${displayName}" onerror="this.src='https://via.placeholder.com/400x300?text=NOBOROCK+Image'">
          </div>
          <div class="shoe-info">
            <div class="shoe-brand">${t.rankPrefix}${idx + 1}${t.rankSuffix}${shoe.brand}</div>
            <div class="shoe-name">${displayName}</div>
            <div class="rec-size">${t.recSizePrefix}${shoe.recommendedSize}</div>
            <div class="size-range-info">${t.inStockPrefix}${shoe.sizeUnit} ${shoe.sizeMin} 〜 ${shoe.sizeMax}）</div>
            <div class="shoe-price">${t.pricePrefix}${shoe.price}${taxLabel}</div>
            <div class="shoe-desc">${displayDesc}</div>
            ${shoe.noteUrl ? `<a href="${shoe.noteUrl}" target="_blank" rel="noopener noreferrer" class="btn-article">${t.btnArticle}</a>` : ""}
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('view-form').classList.add('hidden');
      document.getElementById('view-result').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });

      sendDataToSpreadsheet({
        action: "saveLog",
        diagnosisId: currentDiagnosisId,
        timestamp: getJSTNowString(),
        sneaker: userAnswers.sneaker,
        levelText: userAnswers.levelText,
        widthText: userAnswers.widthText,
        instepText: userAnswers.instepText,
        heelText: userAnswers.heelText,
        toeText: userAnswers.toeText,
        perfText: userAnswers.perfText,
        priorityText: userAnswers.priorityText,
        topPick: scoredShoes[0] ? scoredShoes[0].name : "N/A"
      });

    } catch (err) {
      alert("Error / エラー: " + err.message);
    }
  }

  function submitRating() {
    const t = I18N[currentLang];
    if (isRatingSubmitted) {
      alert(currentLang === 'en' ? "Rating already submitted." : "評価はすでに送信済みです。");
      return;
    }
    if (!currentRating) {
      alert(currentLang === 'en' ? "Please select a star rating." : "星評価を選択してください。");
      return;
    }

    const comment = document.getElementById('rating-comment').value;
    
    sendDataToSpreadsheet({
      action: "updateRating",
      diagnosisId: currentDiagnosisId,
      timestamp: getJSTNowString(),
      rating: currentRating,
      comment: comment
    });
    
    isRatingSubmitted = true;
    const btnRating = document.getElementById('btn-submit-rating');
    if (btnRating) {
      btnRating.disabled = true;
      btnRating.innerText = t.btnRatingDone;
    }

    alert(currentLang === 'en' ? "Thank you for your feedback!" : "評価を送信しました。ご協力ありがとうございます！");
  }

  function sendDataToSpreadsheet(payload) {
    if (typeof GAS_LOG_URL === 'undefined' || !GAS_LOG_URL) return;
    try {
      fetch(GAS_LOG_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      }).catch(err => console.error("GAS Send Error:", err));
    } catch (e) {
      console.error("Fetch Exception:", e);
    }
  }

  function resetForm() {
    const t = I18N[currentLang];
    currentRating = 0;
    isRatingSubmitted = false;
    document.querySelectorAll('#rating-stars .star').forEach(s => s.classList.remove('active'));
    document.getElementById('rating-comment').value = '';
    
    const btnRating = document.getElementById('btn-submit-rating');
    if (btnRating) {
      btnRating.disabled = false;
      btnRating.innerText = t.btnSubmitRating;
    }

    document.getElementById('view-result').classList.add('hidden');
    document.getElementById('view-form').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
</body>
</html>
